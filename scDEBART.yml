dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - statsmodels
  - patsy
  - joblib
  - threadpoolctl
  - packaging
  - attrs
  - python-dateutil
  - tqdm
  - natsort
  - session-info2
  - matplotlib
  - seaborn
  - fonttools
